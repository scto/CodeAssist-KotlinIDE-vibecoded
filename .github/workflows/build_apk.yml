name: Build Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (debug, release, or all)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
          - all

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        
      - name: Setup Environment Files
        run: |
          # Ensure .env exists for Secrets Gradle Plugin
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
          elif [ ! -f ".env" ]; then
            touch .env
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'
          # gradle-wrapper.jar wurde auf Termux gebaut (nicht offiziell) -> Pruefsumme unbekannt.
          # Entfernen, sobald das offizielle Jar eingecheckt ist.
          validate-wrappers: false

      - name: Ensure Gradle Wrapper Executable
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
          else
            gradle wrapper --gradle-version 9.3.1
            chmod +x gradlew
          fi

      - name: Build Debug APK
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'all' }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Release APK
        if: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'all') }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload All APKs
        uses: actions/upload-artifact@v7
        with:
          name: all-apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

      - name: Create Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: app/build/outputs/apk/**/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true    
